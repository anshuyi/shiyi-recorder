name: Windows installer build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build:public:win -- --preview
      - run: node --test scripts/lib/public-windows-profile.test.mjs
      - name: Install and test without a development checkout runtime
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-Setup.exe | Select-Object -First 1
          $testInstallPath = Join-Path $env:RUNNER_TEMP 'shiyi-install-test'
          Write-Host 'Starting silent installation'
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$testInstallPath") -WindowStyle Hidden -PassThru
          if (!$installProcess.WaitForExit(120000)) { Stop-Process -Id $installProcess.Id -Force; throw 'Installer process exceeded two minutes' }
          if ($installProcess.ExitCode -ne 0) { throw "Installer failed: $($installProcess.ExitCode)" }
          $testExe = Join-Path $testInstallPath '十一录屏.exe'
          if (!(Test-Path -LiteralPath $testExe)) { throw 'Installed app is missing' }
          Write-Host 'Installation complete; starting decoded playback and MP4 export checks'
          node scripts/smoke-audio-preview-installed.mjs --installed --virtual-audio-output "--exe=$testExe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed playback and export smoke failed' }
          $savedProjects = @(Get-ChildItem .tmp/audio-preview-installed -Recurse -Filter audio.recordly)
          if ($savedProjects.Count -eq 0) { throw 'Saved test project is missing' }
          $savedHashes = @{}
          foreach ($project in $savedProjects) { $savedHashes[$project.FullName] = (Get-FileHash -LiteralPath $project.FullName -Algorithm SHA256).Hash }
          $uninstaller = Join-Path $testInstallPath 'Uninstall 十一录屏.exe'
          Write-Host 'Playback/export complete; starting silent uninstall'
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList '/S' -WindowStyle Hidden -PassThru
          if (!$uninstallProcess.WaitForExit(60000)) { Stop-Process -Id $uninstallProcess.Id -Force; throw 'Uninstaller process exceeded one minute' }
          if ($uninstallProcess.ExitCode -ne 0) { throw 'Uninstaller failed' }
          foreach ($project in $savedProjects) {
            if (!(Test-Path -LiteralPath $project.FullName) -or (Get-FileHash -LiteralPath $project.FullName -Algorithm SHA256).Hash -ne $savedHashes[$project.FullName]) { throw 'Uninstall modified a saved test project' }
          }
          Write-Host 'Installation, playback/export, and saved-project preservation checks complete'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shiyi-recorder-windows-preview
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt
            .tmp/audio-preview-installed/**/playback-attempt.json
            .tmp/audio-preview-installed/**/results.json
            .tmp/audio-preview-installed/**/app.log
          include-hidden-files: true
          if-no-files-found: error
